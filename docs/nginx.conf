server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index arkon-guide.html;
    charset utf-8;

    # Mặc định mở slide guide — serve trực tiếp, không 302
    location = / {
        try_files /arkon-guide.html =404;
    }

    # Cho phép phát/tải video webm + mp4 ổn định trên trình duyệt
    location ~* \.(mp4|webm)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        types { video/mp4 mp4; video/webm webm; }
    }

    # Ảnh thì cache 7 ngày
    location ~* \.(jpg|jpeg|png|webp|svg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cho phép embed video qua iframe nếu cần nhúng trang khác
    add_header X-Frame-Options "SAMEORIGIN";
}
